name: Release

on:
  push:
    branches: [main]
    paths: [version.txt]
  workflow_dispatch: {}   # manual trigger (e.g. re-publish the current version.txt release)

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read version, guard, check existing release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash ci/check-version.sh
          VERSION="$(tr -d '[:space:]' < version.txt)"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — skipping"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, toolchain: stable-x86_64-pc-windows-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: MinGW-w64 gcc (for rusb/libusb)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: false
      - name: Put MinGW on PATH
        shell: bash
        run: echo "$(cygpath -w /mingw64/bin)" >> "$GITHUB_PATH"
      - name: Install GNU Rust toolchain
        shell: bash
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build (release)
        shell: bash
        run: cargo build --release
      - name: Package bundle + SHA256
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NAME: ${{ matrix.name }}
        run: |
          STAGE="g13-driver-v${VERSION}-${NAME}"
          mkdir "$STAGE"
          cp target/release/g13-driver.exe "$STAGE"/
          cp config.toml "$STAGE"/
          cp -r profiles "$STAGE"/
          cp LICENSE "$STAGE"/
          cp packaging/README.txt "$STAGE"/
          7z a "${STAGE}.zip" "$STAGE" >/dev/null
          sha256sum "${STAGE}.zip" > "${STAGE}.zip.sha256"
          ls -l "${STAGE}.zip" "${STAGE}.zip.sha256"
      - name: Build installer (Inno Setup)
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          choco install innosetup -y --no-progress
          # `|| true`: `find` exits non-zero when a search root is absent (the P.F. path
          # won't exist — Inno is 32-bit), which under `set -eo pipefail` would abort the
          # step before the loud check below. Guard it so the `test -n` gate runs.
          ISCC="$(find "/c/Program Files (x86)/Inno Setup 6" "/c/Program Files/Inno Setup 6" -name ISCC.exe 2>/dev/null | head -n1 || true)"
          test -n "$ISCC" || { echo "ISCC.exe not found after choco install"; exit 1; }
          # Give the setup.exe the g13 icon that build.rs generated (best-effort).
          ICO="$(find target/release/build -name g13.ico | head -n1 || true)"
          if [ -n "$ICO" ]; then cp "$ICO" packaging/g13.ico; fi
          "$ISCC" "//DAppVersion=${VERSION}" packaging/g13-driver.iss
          SETUP="g13-driver-v${VERSION}-setup.exe"
          test -f "$SETUP"
          sha256sum "$SETUP" > "${SETUP}.sha256"
          ls -l "$SETUP" "${SETUP}.sha256"
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            g13-driver-v*-*.zip
            g13-driver-v*-*.zip.sha256
            g13-driver-v*-setup.exe
            g13-driver-v*-setup.exe.sha256

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
